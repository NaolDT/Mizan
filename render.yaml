# Render Blueprint for the Mizan API (Express + Prisma).
# The React client is deployed separately on Vercel (see client/vercel.json).
# Full walkthrough: docs/DEPLOYMENT.md
services:
  - type: web
    name: mizan-api
    runtime: node
    plan: free
    # Same region as the Neon database (eu-central-1).
    region: frankfurt
    # --include=dev is required: NODE_ENV=production would otherwise skip
    # typescript and prisma, which the build needs.
    buildCommand: npm ci --include=dev && npm run build --workspace=shared && npm run db:generate && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Values below are entered in the Render dashboard and never committed.
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADDIS_API_KEY
        sync: false
      - key: PUBLIC_API_URL
        value: https://mizan-vwqy.onrender.com
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: BILLING_ADMIN_KEY
        sync: false
